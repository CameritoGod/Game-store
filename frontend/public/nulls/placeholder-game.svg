<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="50%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="760" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <g transform="translate(300, 360)" text-anchor="middle">
    <!-- Gamepad Icon -->
    <path d="M-50 -40 C-80 -40 -100 -20 -110 20 C-115 40 -110 70 -90 80 C-75 88 -60 70 -50 50 C-40 35 -30 30 0 30 C30 30 40 35 50 50 C60 70 75 88 90 80 C110 70 115 40 110 20 C100 -20 80 -40 50 -40 Z" fill="#242430" stroke="url(#accent)" stroke-width="4"/>
    <!-- D-pad -->
    <rect x="-75" y="-15" width="20" height="6" rx="2" fill="#7C3AED"/>
    <rect x="-68" y="-22" width="6" height="20" rx="2" fill="#7C3AED"/>
    <!-- Action buttons -->
    <circle cx="60" cy="-15" r="5" fill="#2D6BFF"/>
    <circle cx="72" cy="-3" r="5" fill="#21C55D"/>
    <circle cx="48" cy="-3" r="5" fill="#EF4444"/>
    <circle cx="60" cy="9" r="5" fill="#FACC15"/>
  </g>
  <text x="300" y="490" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="1">GAMESTORE</text>
  <text x="300" y="525" text-anchor="middle" fill="#8A8A8A" font-family="sans-serif" font-size="16">Imagen no disponible</text>
</svg>
